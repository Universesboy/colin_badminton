title: Colin Coaching Philosophy 教学理念
updated: '2026-11-23'
rules: 'Claims need video evidence with timestamps. Status: observed | hypothesis | repeated_pattern (>=3
  videos, automatic) | confirmed (Colin only) | revised. Never delete a claim; keep history.'
stated_principles:
  source: colinbadminton.com Training page (Colin's own published text, src/data/site.js), read 2026-11-23
  status: stated_by_colin (not yet observed in a teaching video)
  items:
  - title: Technical Foundation
    text: Mastering proper technique is essential before building speed and power.
  - title: Tactical Awareness
    text: Understanding game strategy and developing court awareness and decision-making.
  - title: Physical Conditioning
    text: Building the strength, speed, and endurance needed for competitive play.
  - title: Mental Toughness
    text: Developing focus, resilience, and competitive mindset for match play.
  - title: Bilingual Instruction
    text: Professional coaching in both English and Chinese
  - title: Detailed Analysis
    text: Thorough analysis of student strengths and areas for improvement
  - title: Continuous Support
    text: Post-lesson feedback and development planning
