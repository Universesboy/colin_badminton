  edit_rhythm:
    label:
      zh: 剪辑节奏
      en: Edit rhythm
    status: has_evidence
    claims:
    - id: edit_rhythm-01
      claim: The Xiaohongshu highlight keeps rallies from one fixed court-side camera, then switches to
        other camera angles for the last few seconds.
      status: observed
      confidence: low
      evidence:
      - video: xhs-ocaa-highlight-2024-05-23 (小红书制作资料/OCAA 男单精彩片段.mp4)
        added: '2026-11-23'
        start: 0
        end: 39.2
        observation: Frames at 0-30 s share one fixed camera position; frames at 33 s, 36 s and 39 s come
          from different, closer angles; the 39 s frame shows a racket lying on the floor next to the
          player in yellow.
      counter_evidence: []
      history: []
      created: '2026-11-23'
      updated: '2026-11-23'
      notes: One video only. Why the ending changes angle (celebration? different camera?) needs Colin's
        confirmation.
